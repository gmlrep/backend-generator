[project]
name = "backend-service-generator"
version = "0.3.1"
description = "Modular FastAPI microservice generator with declarative manifests and atomic scaffolding."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "packaging>=24.0",
    "pyyaml>=6.0",
    "questionary>=2.0",
    "tomlkit>=0.13",
]

[project.scripts]
bsg-generator = "generator.cli:cli"

[dependency-groups]
dev = [
    "mypy>=1.19",
    "pre-commit>=4.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generator"]

[tool.hatch.build.targets.wheel.force-include]
"generator-core" = "generator-core"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "C4"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = "ignore::DeprecationWarning"
