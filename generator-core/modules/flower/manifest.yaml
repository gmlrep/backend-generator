manifest_version: "1"
id: flower
version: "1.0.0"
requires:
  core: ">=1.0.0,<2.0.0"
  modules:
    - celery
conflicts: []
python_dependencies:
  - "flower>=2.0"
env_example:
  - "FLOWER_PORT=5555"
  - "FLOWER_BASIC_AUTH=admin:change-me"
patches:
  - target: docker-compose.yml
    marker: EXTENSION_COMPOSE_SERVICES
    fragment: fragments/flower_compose_service.py.jinja
