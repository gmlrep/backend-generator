# Default scaffold: traces are exported to the collector's debug exporter only.
# Replace/add a real backend exporter (OTLP, Jaeger, etc.) before relying on this
# in staging/production.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
