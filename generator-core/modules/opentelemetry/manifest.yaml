manifest_version: "1"
id: opentelemetry
version: "1.0.0"
requires:
  core: ">=1.0.0,<2.0.0"
  modules: []
conflicts: []
python_dependencies:
  - "opentelemetry-api>=1.27"
  - "opentelemetry-sdk>=1.27"
  - "opentelemetry-exporter-otlp-proto-http>=1.27"
  - "opentelemetry-instrumentation-fastapi>=0.48b0"
  - "opentelemetry-instrumentation-httpx>=0.48b0"
env_example:
  - "OTEL_ENABLED=false"
  - "OTEL_SERVICE_NAME={{project_name}}"
  - "OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318"
patches:
  - target: src/{{project_name}}/core/config.py
    marker: EXTENSION_CONFIG_IMPORTS
    fragment: fragments/otel_config_imports.py.jinja
  - target: src/{{project_name}}/core/config.py
    marker: EXTENSION_SETTINGS
    fragment: fragments/otel_config_settings.py.jinja
  - target: src/{{project_name}}/__main__.py
    marker: EXTENSION_MAIN_IMPORTS
    fragment: fragments/otel_main_imports.py.jinja
  - target: src/{{project_name}}/__main__.py
    marker: EXTENSION_APP_SETUP
    fragment: fragments/otel_app_setup.py.jinja
  - target: src/{{project_name}}/core/lifespan.py
    marker: EXTENSION_LIFESPAN_IMPORTS
    fragment: fragments/otel_lifespan_imports.py.jinja
  - target: src/{{project_name}}/core/lifespan.py
    marker: EXTENSION_LIFESPAN_SHUTDOWN
    fragment: fragments/otel_lifespan_shutdown.py.jinja
  - target: docker-compose.yml
    marker: EXTENSION_COMPOSE_SERVICES
    fragment: fragments/otel_compose_service.py.jinja
  - target: docker-compose.yml
    marker: EXTENSION_COMPOSE_ENV
    fragment: fragments/otel_compose_env.py.jinja
