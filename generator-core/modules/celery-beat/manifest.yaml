manifest_version: "1"
id: celery-beat
version: "1.0.0"
requires:
  core: ">=1.0.0,<2.0.0"
  modules:
    - celery
conflicts: []
python_dependencies: []
patches:
  - target: src/{{project_name}}/infrastructure/celery/app.py
    marker: EXTENSION_CELERY_BEAT
    fragment: fragments/celery_beat_app.py.jinja
  - target: src/{{project_name}}/tasks/__init__.py
    marker: EXTENSION_TASKS
    fragment: fragments/celery_beat_tasks.py.jinja
  - target: docker-compose.yml
    marker: EXTENSION_COMPOSE_SERVICES
    fragment: fragments/celery_beat_compose_service.py.jinja
