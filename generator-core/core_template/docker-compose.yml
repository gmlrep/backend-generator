services:
  api:
    build: .
    # Load the generated .env (created from .env.example at scaffold time).
    env_file:
      - .env
    ports:
      - "${API_PORT:-9000}:${API_PORT:-9000}"
    environment:
      # Network-only overrides on top of .env
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      # The api container applies migrations when the database is empty.
      - RUN_MIGRATIONS=true
      # EXTENSION_COMPOSE_ENV
    depends_on:
      db:
        condition: service_healthy
      # EXTENSION_COMPOSE_DEPENDS_ON

  db:
    image: postgres:18-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # Postgres 18 defaults to a version-specific data directory; pin it to
      # the mounted volume so data survives container recreation.
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  # EXTENSION_COMPOSE_SERVICES

volumes:
  pgdata:
  # EXTENSION_COMPOSE_VOLUMES
